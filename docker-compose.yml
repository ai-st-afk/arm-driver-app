services:
  gateway:
    image: arm-driver-app-gateway-test3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_PORT: "8080"
      DATA_DIR: "/app/data"
      RELEASES_DIR: "/app/releases"
      WEB_COOKIE_NAME: "arm_driver_web_test3"
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.arm-driver-gateway.rule=Host(`${ARM_DRIVER_DOMAIN}`)
      - traefik.http.routers.arm-driver-gateway.entrypoints=websecure
      - traefik.http.routers.arm-driver-gateway.tls.certresolver=le
      - traefik.http.services.arm-driver-gateway.loadbalancer.server.port=8080
    volumes:
      # Технический delivery-cache: FCM-токены устройств и последние XML
      # разнарядок для выдачи мобильному приложению после push.
      - arm_driver_gateway_data:/app/data
      # APK для самообновления приложения. Папка на хосте, а не в volume:
      # tools/release-apk.sh кладёт туда файл rsync'ом, шлюз только читает,
      # и новая версия раздаётся без перезапуска контейнера.
      - ./releases:/app/releases:ro

  gateway-prod:
    image: arm-driver-app-gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      HTTP_PORT: "8080"
      DATA_DIR: "/app/data"
      RELEASES_DIR: "/app/releases"
      WEB_COOKIE_NAME: "arm_driver_web_prod"
      WEB_COOKIE_PATH: "/prod"
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.arm-driver-gateway-prod.rule=Host(`${ARM_DRIVER_DOMAIN}`) && PathPrefix(`/prod`)
      - traefik.http.routers.arm-driver-gateway-prod.priority=100
      - traefik.http.routers.arm-driver-gateway-prod.entrypoints=websecure
      - traefik.http.routers.arm-driver-gateway-prod.tls.certresolver=le
      - traefik.http.routers.arm-driver-gateway-prod.middlewares=arm-driver-prod-strip
      - traefik.http.middlewares.arm-driver-prod-strip.stripprefix.prefixes=/prod
      - traefik.http.services.arm-driver-gateway-prod.loadbalancer.server.port=8080
    volumes:
      - arm_driver_gateway_prod_data:/app/data
      - ./releases-prod:/app/releases:ro

networks:
  edge:
    external: true

volumes:
  arm_driver_gateway_data:
  arm_driver_gateway_prod_data:
